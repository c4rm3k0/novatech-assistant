
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>NOVATECH Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    header {
      background: #101827;
      color: white;
      padding: 24px 18px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #bdcce0; }
    main {
      width: min(650px, 100%);
      margin: 24px auto;
      padding: 16px;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #17203312;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
      resize: vertical;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2458d3;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 18px;
      padding: 14px;
      background: #eef4ff;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>NOVATECH</h1>
    <p>Assistant professionnel intelligent</p>
  </header>

  <main>
    <section class="panel">
      <h2>Comment puis-je vous aider ?</h2>
      <p>Décrivez votre demande professionnelle.</p>

      <form id="assistantForm">
        <textarea id="question"
          maxlength="3000"
          required
          placeholder="Ex. : prépare une réponse à un client qui demande un devis..."></textarea>
        <button type="submit">Préparer une réponse</button>
      </form>

      <div id="result" hidden aria-live="polite"></div>
    </section>
  </main>

  <footer>
    NOVATECH Assistant — Prototype v0.1
  </footer>

  <script>
    const form = document.getElementById("assistantForm");
    const question = document.getElementById("question");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = question.value.trim();
      if (!text) return;

      result.hidden = false;
      result.textContent =
        "Demande enregistrée dans cette démonstration.\n\n" +
        "Votre demande : " + text +
        "\n\nLe moteur IA sera connecté à une prochaine étape. " +
        "Aucun message externe n'a été envoyé.";
    });
  </script>
</body>
</html>
